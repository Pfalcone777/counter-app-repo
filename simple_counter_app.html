<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Counter App</title>
    <!-- Tailwind CSS for modern responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <main class="bg-slate-800/80 backdrop-blur-md border border-slate-700/60 shadow-2xl rounded-3xl p-8 sm:p-10 max-w-sm w-full text-center transition-all duration-300">
        
        <!-- Header -->
        <h1 class="text-sm font-semibold tracking-wider text-slate-400 uppercase mb-6">
            Counter Application
        </h1>

        <div class="bg-slate-950/60 border border-slate-800 rounded-2xl py-8 px-4 mb-8 shadow-inner flex items-center justify-center">
            <span id="counterValue" class="text-6xl sm:text-7xl font-extrabold text-white transition-all duration-200 inline-block scale-100">
                0
            </span>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-4">
            <button 
                id="decrementBtn" 
                class="bg-slate-700 hover:bg-slate-600 active:bg-slate-800 text-white font-bold py-4 rounded-2xl text-2xl shadow-lg hover:shadow-slate-700/30 transition-all duration-150 flex items-center justify-center select-none active:scale-95"
                aria-label="Decrement count"
            >
                −
            </button>
            <button 
                id="incrementBtn" 
                class="bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-bold py-4 rounded-2xl text-2xl shadow-lg hover:shadow-indigo-600/30 transition-all duration-150 flex items-center justify-center select-none active:scale-95"
                aria-label="Increment count"
            >
                +
            </button>
        </div>

        <button 
            id="resetBtn" 
            class="w-full bg-transparent hover:bg-slate-700/50 text-slate-400 hover:text-slate-200 font-semibold py-2.5 px-4 rounded-xl border border-slate-700/50 hover:border-slate-600 text-sm transition-all duration-150 select-none active:scale-95"
        >
            Reset Counter
        </button>
    </main>

    <script>
        // State management variable
        let count = 0;

        // DOM elements reference
        const counterDisplay = document.getElementById('counterValue');
        const incrementBtn = document.getElementById('incrementBtn');
        const decrementBtn = document.getElementById('decrementBtn');
        const resetBtn = document.getElementById('resetBtn');

        // Function to update display with subtle visual pulse effect
        function updateDisplay() {
            counterDisplay.textContent = count;
            
            // Trigger quick scale animation
            counterDisplay.classList.remove('scale-100');
            counterDisplay.classList.add('scale-110');
            
            setTimeout(() => {
                counterDisplay.classList.remove('scale-110');
                counterDisplay.classList.add('scale-100');
            }, 100);
        }

        // Event listeners
        incrementBtn.addEventListener('click', () => {
            count++;
            updateDisplay();
        });

        decrementBtn.addEventListener('click', () => {
            count--;
            updateDisplay();
        });

        resetBtn.addEventListener('click', () => {
            count = 0;
            updateDisplay();
        });
    </script>
</body>
</html>
